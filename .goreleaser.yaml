version: 2

project_name: obstudio

builds:
  - dir: observer
    main: ./cmd/obstudio
    binary: obstudio
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{.Version}}
    # Fixed constant (2026-01-01T00:00:00Z), not CommitTimestamp: the prepare-release PR commit and the merge commit differ.
    mod_timestamp: "1767225600"

archives:
  - formats:
      - zip
    wrap_in_directory: true
    builds_info:
      mode: 0755
      mtime: "2026-01-01T00:00:00Z"
    files:
      - src: .release/weaver/{{ .Os }}-{{ .Arch }}/weaver*
        strip_parent: true
        info:
          mode: 0755
          mtime: "2026-01-01T00:00:00Z"
      - src: docs/USER.md
        info:
          mode: 0644
          mtime: "2026-01-01T00:00:00Z"
      - src: docs/examples.md
        info:
          mode: 0644
          mtime: "2026-01-01T00:00:00Z"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .release/plugins/obstudio_codex_{{ .Version }}.zip
    - glob: .release/plugins/obstudio_claude_{{ .Version }}.zip
    - glob: extension/*.vsix

release:
  github:
    owner: signalfx
    name: obstudio
  replace_existing_artifacts: true
  extra_files:
    - glob: .release/plugins/obstudio_codex_{{ .Version }}.zip
    - glob: .release/plugins/obstudio_claude_{{ .Version }}.zip
    - glob: extension/*.vsix

changelog:
  sort: asc
