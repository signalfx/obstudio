[project]
name = "splunk-ao-langchain-demo"
version = "0.1.0"
description = "Local Splunk AO LangChain callback integration fixture"
requires-python = ">=3.11,<3.15"
dependencies = [
    "splunk-ao[langchain] @ git+https://github.com/splunk/splunk-ao-python.git@7a80c1df3a6f5728eec8a470fe7498a3dc76086a",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
