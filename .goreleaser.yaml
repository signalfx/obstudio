version: 2

project_name: obstudio

builds:
  - dir: observer
    main: ./cmd/obstudio
    binary: obstudio
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - zip
    wrap_in_directory: true
    files:
      - src: .release/weaver/{{ .Os }}-{{ .Arch }}/weaver*
        strip_parent: true
      - docs/USER.md
      - docs/examples.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .release/plugins/obstudio_codex_{{ .Version }}.zip
    - glob: .release/plugins/obstudio_claude_{{ .Version }}.zip
    - glob: extension/*.vsix

release:
  github:
    owner: signalfx
    name: obstudio
  replace_existing_artifacts: true
  extra_files:
    - glob: .release/plugins/obstudio_codex_{{ .Version }}.zip
    - glob: .release/plugins/obstudio_claude_{{ .Version }}.zip
    - glob: extension/*.vsix

changelog:
  sort: asc
