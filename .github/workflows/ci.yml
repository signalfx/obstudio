name: Windows listener diagnostic (ephemeral)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-listener-diagnostic:
    name: Inspect Windows listener query
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Run unchanged process-control tests with native-query diagnostics
        shell: pwsh
        working-directory: extension
        run: |
          $preload = Join-Path $env:RUNNER_TEMP 'obstudio-listener-diagnostic.cjs'
          @'
          // Temporary CI diagnostics. Never print command arguments or output contents.
          'use strict';
          const cp = require('node:child_process');
          const { performance } = require('node:perf_hooks');
          const originalExecFile = cp.execFile;

          function inspectionKind(file, args) {
            if (typeof file !== 'string' || !/(?:^|[\\/])powershell\.exe$/i.test(file)
                || !Array.isArray(args) || args.length !== 4
                || args[0] !== '-NoProfile' || args[1] !== '-NonInteractive'
                || args[2] !== '-Command' || typeof args[3] !== 'string') {
              return undefined;
            }
            if (args[3].startsWith('$connections = @(Get-NetTCPConnection -ErrorAction Stop); ')) {
              return 'NetTCP';
            }
            if (/^\$p = Get-Process -Id [1-9][0-9]* -ErrorAction SilentlyContinue; /.test(args[3])) {
              return 'Process';
            }
            return undefined;
          }

          function diagnosticExecFile(...callArgs) {
            const kind = inspectionKind(callArgs[0], callArgs[1]);
            const callbackIndex = callArgs.length - 1;
            const callback = callArgs[callbackIndex];
            if (kind === undefined || typeof callback !== 'function') {
              return Reflect.apply(originalExecFile, this, callArgs);
            }
            const started = performance.now();
            let callbackEntered = false;
            const record = (error, stdout, stderr) => {
              try {
                const code = error?.code;
                const signal = error?.signal;
                const length = (value) => typeof value === 'string' || Buffer.isBuffer(value) ? value.length : null;
                const metadata = {
                  kind,
                  elapsed_ms: Math.round((performance.now() - started) * 1000) / 1000,
                  timeout_ms: typeof callArgs[2]?.timeout === 'number' ? callArgs[2].timeout : null,
                  error: error == null ? null : {
                    code: typeof code === 'number' || (typeof code === 'string' && /^[A-Z0-9_]{1,64}$/.test(code)) ? code : null,
                    killed: typeof error.killed === 'boolean' ? error.killed : null,
                    signal: typeof signal === 'string' && /^SIG[A-Z0-9]{1,20}$/.test(signal) ? signal : null,
                  },
                  stdout_length: length(stdout),
                  stderr_length: length(stderr),
                };
                process.stderr.write('[windows-listener-diagnostic] ' + JSON.stringify(metadata) + '\n');
              } catch {}
            };
            const forwardedArgs = [...callArgs];
            forwardedArgs[callbackIndex] = function (...callbackArgs) {
              callbackEntered = true;
              record(...callbackArgs);
              return Reflect.apply(callback, this, callbackArgs);
            };
            try {
              return Reflect.apply(originalExecFile, this, forwardedArgs);
            } catch (error) {
              if (!callbackEntered) {
                record(error, undefined, undefined);
              }
              throw error;
            }
          }

          Object.defineProperties(diagnosticExecFile, Object.getOwnPropertyDescriptors(originalExecFile));
          cp.execFile = diagnosticExecFile;
          require('node:module').syncBuiltinESMExports();
          '@ | Set-Content -LiteralPath $preload -Encoding utf8
          $previousNodeOptions = $env:NODE_OPTIONS
          $testExitCode = 1
          try {
            $preloadOption = '--require="' + $preload.Replace('\', '/') + '"'
            $env:NODE_OPTIONS = if ([string]::IsNullOrWhiteSpace($previousNodeOptions)) {
              $preloadOption
            } else {
              "$previousNodeOptions $preloadOption"
            }
            npm run test:process-control
            $testExitCode = $LASTEXITCODE
          } finally {
            $env:NODE_OPTIONS = $previousNodeOptions
          }
          exit $testExitCode
