[run]
mode = "with_skill"

[rubric]
enabled = true

[runtime]
enabled = false

[models]
# Agent model can be set here or overridden with MODEL=... in Make.
agent = "gpt-6.1-sol"
judge = "gpt-6.1-sol"

[agent]
# Do not inherit a host-level effort that the pinned eval models may not support.
extra_args = ["--config", 'model_reasoning_effort="high"', "--config", "sandbox_workspace_write.network_access=true"]
