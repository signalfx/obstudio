# ~/.obstudio/config.yaml — Splunk Observability Studio local configuration.
# Per-user, per-machine; applies to every IDE/agent using this obstudio binary.
# Changes are picked up live unless noted.

# Privacy
telemetry:
  # Allow Cisco to collect pseudonymous usage data about Splunk Observability
  # Studio itself. This setting does not change what Splunk Observability Studio
  # collects from your agents or shows you locally.
  # Values: true or false.
  enabled: true
