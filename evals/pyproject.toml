[project]
name = "obstudio-evals"
version = "0.1.0"
description = "Splunk Observability Studio Codex eval definitions"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2",
  "opentelemetry-sdk>=1.45.0,<2",
  "pytest-codex-evals",
  "pytest>=8.0.0",
  "pytest-xdist>=3.6.0",
  "python-dotenv>=1.2.2",
]

[tool.uv.sources]
pytest-codex-evals = { path = "../pytest-codex-evals", editable = true }

[dependency-groups]
dev = [
  "flask>=3.0.0",
  "openai>=1.30.0",
  "opentelemetry-instrumentation-flask>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
]

[tool.pytest.ini_options]
testpaths = ["."]
