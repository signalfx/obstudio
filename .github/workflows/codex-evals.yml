name: Codex Skill Evals

# Pull requests run only the no-model gates (report freshness, validation).
# Live Codex A/B evals spend model tokens, so they run only on manual dispatch
# and skip cleanly when OPENAI_API_KEY is unavailable.

on:
  pull_request:
    paths:
      - "skills/**"
      - "evals/**"
      - "eval-reports/**"
      - "plugins/obstudio/.codex-plugin/**"
      - ".github/workflows/codex-evals.yml"
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill directory, for example skills/otel-audit"
        required: false
        default: "skills/otel-audit"
      case:
        description: "Optional eval case path, for example go/chi-basic"
        required: false
        default: "go/chi-basic"
      prompt:
        description: "Optional pytest -k prompt filter, for example direct"
        required: false
        default: "direct"
      model:
        description: "Codex model for live A/B evals"
        required: false
        default: "gpt-6.1-sol"

permissions:
  contents: read

concurrency:
  group: codex-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-evals:
    name: Skill evals - validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run pytest plugin tests
        run: make test-pytest-plugin

      - name: Verify eval report freshness
        run: make -C evals eval-report-freshness

      - name: Validate eval JSONs and reports
        env:
          EVAL_SKILL: ${{ github.event.inputs.skill }}
          EVAL_CASE: ${{ github.event.inputs.case }}
          EVAL_PROMPT: ${{ github.event.inputs.prompt }}
        run: make eval-validation SKILL="$EVAL_SKILL" CASE="$EVAL_CASE" PROMPT="$EVAL_PROMPT"

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-eval-validation-reports
          path: |
            eval-reports/
            .workspace/codex-evals/
          if-no-files-found: ignore

  skill-evals-live-ab:
    name: Skill evals - live Codex A/B
    runs-on: ubuntu-latest
    needs: skill-evals
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check model API secret
        id: secret
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "OPENAI_API_KEY unavailable; skipping live evals."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'

      - uses: astral-sh/setup-uv@v5
        if: steps.secret.outputs.available == 'true'
        with:
          enable-cache: true

      - name: Create isolated eval Codex home
        if: steps.secret.outputs.available == 'true'
        run: make eval-codex-home

      # openai/codex-action bootstraps the Codex CLI and Responses API proxy.
      # After this step, later shell steps in the same job can call `codex`.
      - name: Bootstrap Codex CLI
        if: steps.secret.outputs.available == 'true'
        uses: openai/codex-action@v1
        env:
          CODEX_HOME: ${{ github.workspace }}/.workspace/codex-evals/codex-home
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: "Print the Codex version and exit."
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Run live Codex A/B evals
        if: steps.secret.outputs.available == 'true'
        env:
          EVAL_CODEX_HOME: ${{ github.workspace }}/.workspace/codex-evals/codex-home
          EVAL_CODEX_AUTH: external
          EVAL_SKILL: ${{ github.event.inputs.skill }}
          EVAL_CASE: ${{ github.event.inputs.case }}
          EVAL_PROMPT: ${{ github.event.inputs.prompt }}
          EVAL_MODEL: ${{ github.event.inputs.model }}
        run: |
          make eval-all-ab \
            SKILL="$EVAL_SKILL" \
            CASE="$EVAL_CASE" \
            PROMPT="$EVAL_PROMPT" \
            MODEL="$EVAL_MODEL"

      - name: Upload live A/B reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-eval-live-ab-reports
          path: |
            eval-reports/
            .workspace/codex-evals/
          if-no-files-found: ignore
