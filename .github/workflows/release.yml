name: Release

on:
  push:
    tags: ["v*"]
  # Dispatched with `--ref <tag>` by tag-release.yml; tags pushed with GITHUB_TOKEN do not fire the push trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release-ref:
    name: Verify release tag and plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tag on main whose plugin manifests already carry its version
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Releases must run from a tag ref, got ${REF_TYPE} '${RELEASE_TAG}'"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::${RELEASE_TAG} (${RELEASE_SHA}) is not on main; merge the prepare-release PR and tag from main"
            exit 1
          fi
          python3 plugins/obstudio/scripts/stage_obstudio_plugin.py \
            --check-manifest-versions --release-tag "$RELEASE_TAG"

  verify-runtime-reproducible:
    name: Verify runtime archives match the reviewed manifest
    needs: verify-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild runtime archives from this tag
        uses: ./.github/actions/build-runtime-archives
        with:
          release_tag: ${{ github.ref_name }}

      - name: Require rebuilt archives to match plugins/obstudio/hooks/runtime-manifest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 plugins/obstudio/scripts/stage_obstudio_plugin.py \
            --verify-runtime-manifest --release-tag "$RELEASE_TAG" --dist-dir dist

  build-vsix:
    name: Build VSIX – ${{ matrix.target }}
    needs: verify-release-ref
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            observer/client/package-lock.json
            extension/package-lock.json

      - name: Pin npm version
        run: |
          npm i -g npm@11.6.2
          npm --version

      - uses: actions/setup-go@v5
        with:
          go-version-file: observer/go.mod
          cache-dependency-path: observer/go.sum

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build target VSIX package
        working-directory: extension
        timeout-minutes: 40
        run: npm run build:vsix -- --target "${{ matrix.target }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: observability-studio-vsix-${{ matrix.target }}
          path: extension/*.vsix
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-vsix, verify-runtime-reproducible]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            observer/client/package-lock.json
            extension/package-lock.json

      - name: Pin npm version
        run: |
          npm i -g npm@11.6.2
          npm --version

      - uses: actions/setup-go@v5
        with:
          go-version-file: observer/go.mod
          cache-dependency-path: observer/go.sum

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: observability-studio-vsix-*
          path: extension
          merge-multiple: true

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Verify Open VSX publish access
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          : "${OVSX_PAT:?OVSX_PAT secret is not configured}"
          ./node_modules/.bin/ovsx verify-pat Splunk

      - name: Prepare release assets
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-prep

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # verify-runtime-reproducible is the gate that blocks publishing; GoReleaser OSS cannot
      # build and publish in separate steps, so this re-check only confirms what was just uploaded.
      - name: Re-verify published runtime archives against the manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 plugins/obstudio/scripts/stage_obstudio_plugin.py \
            --verify-runtime-manifest --release-tag "$RELEASE_TAG" --dist-dir dist

      - name: Publish VSIX to Open VSX
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          failures=0
          ls -1 *.vsix
          for vsix in *.vsix; do
            echo "Publishing ${vsix} to Open VSX"
            if ! ./node_modules/.bin/ovsx publish --skip-duplicate "${vsix}"; then
              echo "::error::Failed to publish ${vsix} to Open VSX"
              failures=1
            fi
          done
          exit "${failures}"

      - name: Marketplace manual publish reminder
        if: ${{ success() }}
        working-directory: extension
        env:
          MARKETPLACE_PUBLISHER_URL: https://marketplace.visualstudio.com/manage/publishers/Splunk
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          set -euo pipefail
          marketplace_version="$(node -e 'process.stdout.write(require("./build-vsix.js").normalizeReleaseVersion(process.env.GITHUB_REF_NAME))')"
          {
            echo "## Manual Visual Studio Marketplace publish required"
            echo
            echo "GitHub Release and Open VSX publishing completed successfully."
            echo
            echo "Download the four platform-specific VSIX files from [${GITHUB_REF_NAME}](${RELEASE_URL}) and upload those exact files to the [Splunk publisher](${MARKETPLACE_PUBLISHER_URL}). Do not rebuild them."
            echo
            echo "Verify \`Splunk.observability-studio\` version \`${marketplace_version}\` after publishing."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=Manual Marketplace publish required::Upload the four VSIX files from ${RELEASE_URL} to ${MARKETPLACE_PUBLISHER_URL}; do not rebuild them."

  post-publish-smoke:
    name: Smoke test published runtime on ${{ matrix.os }}
    needs: publish-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the Claude plugin from this tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 plugins/obstudio/scripts/stage_obstudio_plugin.py \
            --host claude --release-tag "$RELEASE_TAG" --output "$RUNNER_TEMP/obstudio-plugin"

      - name: Run the SessionStart hook against the published release
        env:
          OBSTUDIO_PLUGIN_HOST: claude
          CLAUDE_PLUGIN_ROOT: ${{ runner.temp }}/obstudio-plugin
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/obstudio-data
        run: |
          set -euo pipefail
          python3 "$CLAUDE_PLUGIN_ROOT/hooks/bootstrap_obstudio.py" < /dev/null

      - name: Assert the running runtime is healthy and matches the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:17900/api/health > "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/health.json" "${RELEASE_TAG#v}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1]))
          want = sys.argv[2]
          assert payload.get("kind") == "obstudio", payload
          assert payload.get("apiVersion") == "v1", payload
          got = str(payload.get("version", "")).lstrip("v")
          assert got == want, f"runtime version {got!r} does not match release {want!r}"
          PY

  sync-plugin-manifests:
    name: Sync plugin manifest versions
    needs: publish-release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/sync-plugin-manifests.yml
    with:
      release_tag: ${{ github.ref_name }}
